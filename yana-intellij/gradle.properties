# Versions live here so that bumping the IDE is one line rather than a search.
#
# `platformVersion` is the CLion build the plugin is compiled and run against. The plugin itself
# declares only the platform module and an optional dependency on the commercial-IDE module, so it
# loads in any paid JetBrains IDE - see src/main/resources/META-INF/plugin.xml.
pluginGroup = se.rimmer.yana
pluginVersion = 0.1.0

platformType = CL
platformVersion = 2025.3

# The oldest and newest builds the plugin declares support for.
#
# `since` has to be at or above the platform being compiled against - the verifier says so, and it is
# right: a plugin compiled against 253 that claims to load in 242 is claiming about API it never saw.
# The LSP API this depends on has been in the platform since 2023.2 and semantic highlighting since
# 2024.2, so an older `since` would be defensible on paper and unverifiable in practice.
#
# There is deliberately no `until`. From build 243 the platform's own advice is to leave it out: an
# upper bound stops the plugin installing the day a user updates their IDE, and this plugin declares
# only the platform module plus an optional one, so there is nothing in it to expire.
pluginSinceBuild = 253

# Must not be older than the Kotlin the target IDE was built with: the platform's own classes carry
# Kotlin metadata 2.2, and an older compiler cannot read it. See the note in build.gradle.kts.
kotlinVersion = 2.2.21
# 2.11.0 is the last release that runs on Gradle 8; 2.12.0 requires Gradle 9. Moving past it also
# means migrating off the standalone Grammar-Kit plugin.
intellijPlatformPluginVersion = 2.11.0
grammarKitVersion = 2022.3.2.2

org.gradle.jvmargs = -Xmx2048m
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
